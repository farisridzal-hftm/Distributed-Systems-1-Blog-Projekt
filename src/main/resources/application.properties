# --- CORS -----------------------------------------------------------------
# Only browser frontends from these origins may call the API. The two entries are the default
# dev-server ports of Angular (4200) and Vite (5173); the production origin is added once a
# frontend is deployed. A wildcard (*) is deliberately not used.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200,http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept,Authorization,X-Max-Results
# Lets the frontend read the URL of a newly created blog or comment.
quarkus.http.cors.exposed-headers=Location
quarkus.http.cors.access-control-max-age=1H

# --- Security (OIDC with Keycloak) ------------------------------------------
# The API only verifies bearer tokens; users log in at Keycloak with the public client below.
quarkus.oidc.client-id=blog-client
# Endpoints without @PermitAll or @RolesAllowed are rejected, so a new one is never public by accident.
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# Variant 1 (default in dev and test): Dev Services start a Keycloak container with the same
# realm file as docker-compose.yml, so users, roles and ids are identical in both variants.
quarkus.keycloak.devservices.realm-path=keycloak/blog-realm.json
quarkus.keycloak.devservices.realm-name=blog
quarkus.keycloak.devservices.image-name=quay.io/keycloak/keycloak:26.8.1
# Quarkus starts Keycloak in production mode by default, which rebuilds the server on every start
# and does not finish within the startup timeout. Dev mode starts in about 20 seconds.
quarkus.keycloak.devservices.start-command=start-dev
# Fixed port in dev mode so tokens can be fetched with HTTPie; tests use a random port.
%dev.quarkus.keycloak.devservices.port=8280

# Variant 2: own Keycloak container from docker-compose.yml, started with
#   ./mvnw quarkus:dev -Dquarkus.profile=external-keycloak
# Setting auth-server-url switches the Dev Services for Keycloak off.
%external-keycloak.quarkus.oidc.auth-server-url=http://localhost:8180/realms/blog
%prod.quarkus.oidc.auth-server-url=http://localhost:8180/realms/blog

# --- OpenAPI / Swagger UI ---------------------------------------------------
quarkus.smallrye-openapi.info-title=Blog API
# Swagger UI shows an "Authorize" button for a bearer token; protected operations get a lock.
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=keycloak
quarkus.smallrye-openapi.security-scheme-description=Access token from Keycloak, see README (paste the token without "Bearer ")
quarkus.swagger-ui.persist-authorization=true
