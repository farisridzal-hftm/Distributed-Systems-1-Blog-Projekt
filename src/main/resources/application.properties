# --- CORS -----------------------------------------------------------------
# Only browser frontends from these origins may call the API. The two entries are the default
# dev-server ports of Angular (4200) and Vite (5173); the production origin is added once a
# frontend is deployed. A wildcard (*) is deliberately not used.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200,http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept,Authorization,X-Max-Results
# Lets the frontend read the URL of a newly created blog or comment.
quarkus.http.cors.exposed-headers=Location
quarkus.http.cors.access-control-max-age=1H

# --- Security (OIDC with Keycloak) ------------------------------------------
# The API only verifies bearer tokens; users log in at Keycloak with the public client below.
quarkus.oidc.client-id=blog-client
# Endpoints without @PermitAll or @RolesAllowed are rejected, so a new one is never public by accident.
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# Variant 1 (default in dev and test): Dev Services start a Keycloak container with the same
# realm file as docker-compose.yml, so users, roles and ids are identical in both variants.
quarkus.keycloak.devservices.realm-path=keycloak/blog-realm.json
quarkus.keycloak.devservices.realm-name=blog
quarkus.keycloak.devservices.image-name=quay.io/keycloak/keycloak:26.8.1
# Quarkus starts Keycloak in production mode by default, which rebuilds the server on every start
# and does not finish within the startup timeout. Dev mode starts in about 20 seconds.
quarkus.keycloak.devservices.start-command=start-dev
# Fixed port in dev mode so tokens can be fetched with HTTPie; tests use a random port.
%dev.quarkus.keycloak.devservices.port=8280

# Variant 2: own Keycloak container from docker-compose.yml, started with
#   ./mvnw quarkus:dev -Dquarkus.profile=external-keycloak
# Setting auth-server-url switches the Dev Services for Keycloak off.
%external-keycloak.quarkus.oidc.auth-server-url=http://localhost:8180/realms/blog

# --- Production (container image) -------------------------------------------
# Everything that differs between environments comes from environment variables. The defaults fit a
# run next to docker-compose.yml. DB_PASSWORD has no default on purpose: without it the application
# refuses to start instead of falling back to a guessable password.
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/blog}
%prod.quarkus.datasource.username=${DB_USER:blog}
%prod.quarkus.datasource.password=${DB_PASSWORD}
# Creates missing tables and columns on startup and keeps existing data. Once the schema has to
# evolve in a controlled way, a migration tool such as Flyway is the next step.
%prod.quarkus.hibernate-orm.schema-management.strategy=update
# Where the backend fetches Keycloak's signing keys ...
%prod.quarkus.oidc.auth-server-url=${OIDC_SERVER_URL:http://localhost:8180/realms/blog}
# ... and which issuer ("iss") the tokens must name. Inside Docker the backend reaches Keycloak as
# http://keycloak:8080, while HTTPie and browsers get their tokens from http://localhost:8180.
%prod.quarkus.oidc.token.issuer=${OIDC_ISSUER:${OIDC_SERVER_URL:http://localhost:8180/realms/blog}}

# @QuarkusIntegrationTest starts the built image with the test profile, so the Dev Services provide
# MySQL and Keycloak; the prod profile would expect real servers.
quarkus.test.integration-test-profile=test

# --- Container image (quarkus-container-image-docker) -----------------------
# ./mvnw package -Dquarkus.container-image.build=true builds the image from
# src/main/docker/Dockerfile.jvm as ghcr.io/farisridzal-hftm/blog-backend:<version> and :latest.
quarkus.container-image.registry=ghcr.io
quarkus.container-image.group=farisridzal-hftm
quarkus.container-image.name=blog-backend
quarkus.container-image.additional-tags=latest
# Links the package on GitHub to this repository.
quarkus.container-image.labels."org.opencontainers.image.source"=https://github.com/farisridzal-hftm/Distributed-Systems-1-Blog-Projekt
quarkus.container-image.labels."org.opencontainers.image.description"=Blog REST API (Quarkus) secured with Keycloak

# --- Logging ----------------------------------------------------------------
# Levels in ch.hftm: ERROR unexpected failures, WARN denied access, INFO system states and business
# events, DEBUG reads and rejected client input. Details in the README.
quarkus.log.category."ch.hftm".level=INFO
%dev.quarkus.log.category."ch.hftm".level=DEBUG
# One line per HTTP request with method, path, status and duration. Headers such as Authorization
# are not part of the pattern, so tokens never end up in the log.
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%h "%r" %s %b bytes %D ms
# Needed for the duration (%D) in the access log.
quarkus.http.record-request-start-time=true
%test.quarkus.http.access-log.enabled=false

# --- Own configuration (ch.hftm.config.BlogConfig) --------------------------
# Creates two demo blogs owned by "bob" when the database is empty.
# Can be switched off without rebuilding: BLOG_SEED_DATA_ENABLED=false
blog.seed-data.enabled=true

# --- OpenAPI / Swagger UI ---------------------------------------------------
quarkus.smallrye-openapi.info-title=Blog API
# Swagger UI shows an "Authorize" button for a bearer token; protected operations get a lock.
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=keycloak
quarkus.smallrye-openapi.security-scheme-description=Access token from Keycloak, see README (paste the token without "Bearer ")
quarkus.swagger-ui.persist-authorization=true
# Also part of the container image, so the deployed API can be tried out in the browser. A real
# production system would leave this off (API8, Security Misconfiguration).
quarkus.swagger-ui.always-include=true
