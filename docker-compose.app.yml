# Complete system: Keycloak (from docker-compose.yml) + MySQL + the backend image from GHCR.
#
#   cp .env.example .env                              once, then choose your own passwords
#   docker compose -f docker-compose.app.yml up -d
#
# The API is then available on http://localhost:8080, Keycloak on http://localhost:8180.
include:
  - docker-compose.yml

services:
  mysql:
    image: mysql:9.5
    container_name: blog-mysql
    environment:
      MYSQL_DATABASE: blog
      MYSQL_USER: blog
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env (see .env.example)}
    volumes:
      - blog-mysql-data:/var/lib/mysql
    healthcheck:
      # TCP instead of the socket: during its first initialisation MySQL runs without networking.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  blog-backend:
    image: ${BACKEND_IMAGE:-ghcr.io/farisridzal-hftm/blog-backend:latest}
    container_name: blog-backend
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/blog
      DB_USER: blog
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}
      # Inside the Docker network Keycloak is "keycloak:8080", but tokens fetched from the host
      # name "localhost:8180" as issuer. The backend needs both, see application.properties.
      OIDC_SERVER_URL: http://keycloak:8080/realms/blog
      OIDC_ISSUER: http://localhost:8180/realms/blog
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  blog-mysql-data:
